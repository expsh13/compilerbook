<svg id="call-storage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="call-storage-title call-storage-desc">
<title id="call-storage-title">命令はコード領域、返り値13はEAX、戻り先アドレスはスタック</title>
<desc id="call-storage-desc">call value、add eax,1、mov eax,13、retの機械語はメモリのコード領域にある。callがスタックに積むのはafter_callのアドレス0x401005。mov eax,13はCPU内のEAXに13を書き、スタックは変更しない。retはスタックから戻り先を読み出す。</desc>
<style>#call-storage text{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;fill:#292e2b}#call-storage .title{font-size:23px;font-weight:600}#call-storage .head{font-size:19px;font-weight:600;fill:#355d4c}#call-storage .small{font-size:15px;fill:#666d66}#call-storage .code{font-family:monospace;font-size:20px}</style>
<defs><marker id="call-storage-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ac4b30"/></marker></defs>
<rect width="960" height="435" rx="6" fill="#fffef9"/>
<text x="24" y="35" class="title">このコードと13は、どこにある？</text>
<text x="24" y="64" class="small">② mov eax, 13 を実行し終えた場面。命令・値・戻り先を分けて見る。</text>
<rect x="24" y="88" width="370" height="287" rx="5" fill="#f8f6f0" stroke="#b7c4b7"/>
<text x="42" y="120" class="head">メモリ：コード領域</text>
<text x="42" y="152" class="code">call value</text>
<text x="42" y="181" class="small">after_call:（仮の住所 0x401005）</text>
<text x="42" y="210" class="code">add eax, 1</text>
<path d="M42 226H376" stroke="#dcded3"/>
<text x="42" y="255" class="code">value:</text>
<rect x="38" y="264" width="338" height="34" rx="3" fill="#e9eee5"/>
<text x="58" y="288" class="code">mov eax, 13</text>
<text x="58" y="320" class="code">ret</text>
<text x="42" y="354" class="small">実際は機械語。ここでは命令表記で表示。</text>
<rect x="642" y="88" width="294" height="126" rx="5" fill="#e9eee5" stroke="#b7c4b7"/>
<text x="660" y="120" class="head">CPU内部：レジスタ</text>
<text x="660" y="154" class="code">EAX = 13</text>
<text x="660" y="190" class="small">mov が13を書き込む場所。</text>
<rect x="642" y="253" width="294" height="122" rx="5" fill="#f2e9dc" stroke="#d9bd9f"/>
<text x="660" y="284" class="head">メモリ：スタック</text>
<text x="660" y="316" class="code">0x0FF8 → 0x401005</text>
<text x="660" y="348" class="small">保存場所 → after_callのアドレス</text>
<path d="M394 282H454V151H632" fill="none" stroke="#ac4b30" stroke-width="2" marker-end="url(#call-storage-arrow)"/>
<text x="474" y="140" class="small">② mov を実行</text>
<path d="M474 316H632" fill="none" stroke="#ac4b30" stroke-width="2" marker-end="url(#call-storage-arrow)"/>
<text x="447" y="342" class="small">① call が住所を保存</text>
<text x="24" y="406" class="small">③ ret はスタックの住所を読み、after_callへ戻る。④ add はEAXを13から14にする。</text>
<text x="24" y="429" class="small">この例では、関数の命令本体や返り値13をスタックにコピーする命令はない。</text>
</svg>
